function scenarioIllustration(m){
 const k=({'Hydrogen Fuel-Cell Car':'car','Rust on a Bicycle':'rust','Carbon in a Campfire':'campfire','Natural Gas Stove':'stove','Bright Magnesium Flame':'magnesium','Vinegar and Baking Soda':'reaction','Cellular Respiration':'respiration','Burning Propane':'propane','Limestone and Cement':'limestone'})[m.title];
 if(!k || !embeddedPhotos[k])return '<div class="photo-fail">Photograph not available for this scenario.</div>';
 const captions={car:'Hydrogen-powered vehicle (promotional graphic)',rust:'Rust and corrosion',campfire:'Burning logs and charcoal',stove:'Blue natural-gas flame',magnesium:'Burning magnesium ribbon',reaction:'Fizzing chemical reaction demonstration',respiration:'Glucose-containing foods; glucose fuels cellular respiration',propane:'Outdoor gas grill',limestone:'Limestone quarry'};
 return `<div class="realphoto"><img class="scenario-photo-real" src="${embeddedPhotos[k]}" alt="${escapeHTML(captions[k])}"><div class="photo-credit">${escapeHTML(captions[k])} • Image supplied for this classroom activity</div></div>`;
}
function render(){const m=getMission();app.innerHTML=`<section class="panel"><div class="row between"><span class="tag">${escapeHTML(student)} • ${escapeHTML(period)}</span><span class="tag">${level.toUpperCase()} • Mission ${idx+1} / 3</span></div><div class="progress"><div style="width:${idx*100/3}%"></div></div><h2>${m.emoji} ${escapeHTML(m.title)}</h2><div class="scene">${scenarioIllustration(m)}<div><strong>REAL-LIFE MYSTERY</strong><p>${escapeHTML(m.story)}</p></div></div><div class="note"><strong>YOUR JOB:</strong> (1) Change coefficients (large numbers BEFORE formulas). (2) Multiply each coefficient by its subscripts to determine how many atom chips belong on each side. (3) Drag chips into BOTH boards. (4) Check your work. <strong>Never change subscripts.</strong></div><div class="equation"><h3 style="margin:0 0 12px">Step 1 • Balance the equation with coefficients</h3><div class="eqrow">${termsHTML(0)}<span class="op">→</span>${termsHTML(1)}</div><p class="help">A missing coefficient means 1. Example: 3H₂O = 6 H atoms and 3 O atoms. You must figure out your own totals.</p></div><h3>Step 2 • Build your atom-chip evidence</h3><p class="muted">Choose a colored atom chip, then drag it into a board. On touch devices, select a chip and tap <strong>Add selected chip</strong>. Tap a chip inside a board to remove it.</p><div class="palette" id="palette">${m.elements.map(el=>chipHTML(el)).join('')}</div><div class="boards"><div class="board" data-drop="left"><h3>⬅ Reactants (before)</h3><div class="drop" id="leftDrop" aria-label="Reactant atom chips"></div><div class="counts" id="leftCount"></div><div class="row"><button data-add="left">+ Add selected chip</button><button data-clear="left">Clear side</button></div></div><div class="board" data-drop="right"><h3>➡ Products (after)</h3><div class="drop" id="rightDrop" aria-label="Product atom chips"></div><div class="counts" id="rightCount"></div><div class="row"><button data-add="right">+ Add selected chip</button><button data-clear="right">Clear side</button></div></div></div><div class="row" style="margin-top:16px"><button id="check" class="primary">🔎 Check coefficients + chips</button><button id="reset">Reset this mission</button></div><div id="feedback" role="status" aria-live="polite"></div><div id="reasoning" class="hidden"><div class="question"><h3>Step 3 • Higher-order thinking</h3><p>${escapeHTML(m.q)}</p><div class="choices">${m.options.map((o,i)=>`<button data-choice="${i}">${String.fromCharCode(65+i)}. ${escapeHTML(o)}</button>`).join('')}</div><p id="choiceFeedback" role="status"></p><label for="explain">Explain using evidence from YOUR atom chips (2–3 sentences).</label><textarea id="explain" placeholder="I know matter was conserved because... The coefficients and subscripts show..."></textarea><p class="help">Write at least 35 characters to explain your model, not just repeat an answer.</p><button class="green" id="next" disabled>${idx===2?'Earn my certificate 🏆':'Unlock next mission →'}</button></div></div></section>`;
 document.querySelectorAll('input[data-side]').forEach(e=>e.onchange=()=>{let v=Number(e.value);if(!Number.isInteger(v)||v<1||v>20){e.value=coeff[Number(e.dataset.side)][Number(e.dataset.i)];return}coeff[Number(e.dataset.side)][Number(e.dataset.i)]=v;invalidate()});document.querySelectorAll('#palette .chip').forEach(b=>{b.onclick=()=>{selected=b.dataset.el;document.querySelectorAll('#palette .chip').forEach(x=>x.classList.toggle('selected',x.dataset.el===selected))};b.ondragstart=e=>{selected=b.dataset.el;e.dataTransfer.setData('text/plain',selected);e.dataTransfer.effectAllowed='copy'}});document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>add(b.dataset.add,selected));document.querySelectorAll('[data-clear]').forEach(b=>b.onclick=()=>{for(const el of m.elements)placed[b.dataset.clear][el]=0;invalidate();drawChips()});document.querySelectorAll('[data-drop]').forEach(b=>{b.ondragover=e=>{e.preventDefault();b.querySelector('.drop').classList.add('over')};b.ondragleave=()=>b.querySelector('.drop').classList.remove('over');b.ondrop=e=>{e.preventDefault();b.querySelector('.drop').classList.remove('over');const el=e.dataTransfer.getData('text/plain');if(m.elements.includes(el))add(b.dataset.drop,el)}});document.getElementById('check').onclick=check;document.getElementById('reset').onclick=load;document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{chosen=Number(b.dataset.choice);document.querySelectorAll('[data-choice]').forEach(x=>x.classList.toggle('chosen',x===b));updateNext()});document.getElementById('explain').oninput=updateNext;document.getElementById('next').onclick=advance;drawChips()}
function invalidate(){unlocked=false;document.getElementById('reasoning').classList.add('hidden');document.getElementById('feedback').innerHTML='';document.getElementById('next').disabled=true;chosen=-1}
function add(side,el){if(placed[side][el]>=40)return;placed[side][el]++;invalidate();drawChips()}
function drawChips(){for(const side of ['left','right']){const drop=document.getElementById(side+'Drop');drop.innerHTML=getMission().elements.map(el=>Array.from({length:placed[side][el]},()=>chipHTML(el,true)).join('')).join('');drop.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{placed[side][b.dataset.el]--;invalidate();drawChips()});document.getElementById(side+'Count').innerHTML=getMission().elements.map(el=>`<span>${el}: ${placed[side][el]} chips</span>`).join('')}}
function equalCounts(a,b,els){return els.every(el=>(a[el]||0)===(b[el]||0))}
function check(){const m=getMission();const left=atomCount(m.terms[0],coeff[0]),right=atomCount(m.terms[1],coeff[1]);const correctEquation=equalCounts(left,right,m.elements);const chipLeft=equalCounts(left,placed.left,m.elements),chipRight=equalCounts(right,placed.right,m.elements);const feedback=document.getElementById('feedback');if(!correctEquation){feedback.innerHTML='<div class="feedback bad">⚠️ The equation is not balanced. Recount atoms using coefficient × subscript on BOTH sides. Adjust coefficients; do not change subscripts.</div>';return}if(!chipLeft||!chipRight){feedback.innerHTML='<div class="feedback bad">🧩 Your coefficients balance, but the atom chips do not match your formulas yet. Multiply each coefficient by each subscript and represent EVERY atom on BOTH sides. Check one element at a time.</div>';return}unlocked=true;feedback.innerHTML=`<div class="feedback good">✅ Balanced! You built ${m.elements.map(el=>`${left[el]||0} ${el}`).join(', ')} atoms on EACH side. ${escapeHTML(m.why)} Now defend your reasoning.</div>`;document.getElementById('reasoning').classList.remove('hidden');updateNext()}
function updateNext(){if(!unlocked)return;const m=getMission(),answer=document.getElementById('explain').value.trim();const correct=chosen===m.a;document.getElementById('choiceFeedback').textContent=chosen<0?'':correct?'✅ Correct reasoning. Now explain your model in writing.':'🔎 Reconsider: what do the coefficients, subscripts, and chips show? Try another answer.';document.getElementById('next').disabled=!(correct&&answer.length>=35)}
function advance(){const m=getMission(),answer=document.getElementById('explain').value.trim();if(!unlocked||chosen!==m.a||answer.length<35)return;records.push({title:m.title,equation:m.terms.map((side,i)=>side.map((f,j)=>`${coeff[i][j]}${f}`).join(' + ')).join(' -> '),counts:JSON.stringify(placed),reasoning:m.options[chosen],explanation:answer});if(idx<2){idx++;load()}else certificate()}
function downloadCertificatePDF(){
 const clean=s=>String(s).normalize('NFKD').replace(/[^\x20-\x7E]/g,'').replace(/[\\()]/g,'');
 const pdfText=(s,x,y,size=16)=>`BT /F1 ${size} Tf ${x} ${y} Td (${clean(s)}) Tj ET`;
 const lines=['0.06 0.13 0.23 rg','0 0 612 792 re f','0.98 0.99 1 rg','24 24 564 744 re f','0.85 0.64 0.20 RG','4 w','36 36 540 720 re S','0.12 0.25 0.43 rg',pdfText('SCIENCE LAB | CERTIFIED ACHIEVEMENT',118,677,17),pdfText('CERTIFICATE OF COMPLETION',94,595,27),pdfText('This certificate is presented to',175,525,16),pdfText(student,Math.max(75,306-student.length*10),458,27),pdfText('POKER CHIP CHEMISTRY LAB',124,383,21),pdfText('Level: '+level.toUpperCase()+'     Class: '+period,150,343,14),pdfText('Balanced 3 equations and demonstrated conservation of matter.',70,292,13),pdfText('Completed: '+new Date().toLocaleDateString(),210,193,14),pdfText('SCIENCE INVESTIGATOR',207,119,16)];
 const stream=lines.join('\n')+'\n';
 const objects=['<< /Type /Catalog /Pages 2 0 R >>','<< /Type /Pages /Kids [3 0 R] /Count 1 >>','<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Resources << /Font << /F1 4 0 R >> >> /Contents 5 0 R >>','<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold >>',`<< /Length ${stream.length} >>\nstream\n${stream}endstream`];
 let pdf='%PDF-1.4\n', offsets=[0];for(let i=0;i<objects.length;i++){offsets.push(pdf.length);pdf+=`${i+1} 0 obj\n${objects[i]}\nendobj\n`;}const xref=pdf.length;pdf+=`xref\n0 ${objects.length+1}\n0000000000 65535 f \n`;for(let i=1;i<offsets.length;i++)pdf+=String(offsets[i]).padStart(10,'0')+' 00000 n \n';pdf+=`trailer\n<< /Size ${objects.length+1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;
 const a=document.createElement('a'),url=URL.createObjectURL(new Blob([pdf],{type:'application/pdf'}));a.href=url;a.download='Poker_Chip_Chemistry_Certificate_'+student.replace(/[^a-z0-9_-]/gi,'_')+'.pdf';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);
}
function certificate(){const date=new Date().toLocaleDateString();app.innerHTML=`<section class="panel"><div class="cert"><div class="seal"><span>SCIENCE</span><strong>LAB</strong><span>ACHIEVEMENT</span></div><h2>Certificate of Scientific Achievement</h2><p>This certifies that</p><div class="name">${escapeHTML(student)}</div><p>${escapeHTML(period)} • ${escapeHTML(level.toUpperCase())} LEVEL</p><h3>POKER CHIP CHEMISTRY</h3><p>Successfully balanced <strong>3 chemical equations</strong>, built atom-chip evidence,<br>and explained the Law of Conservation of Matter.</p><p>${escapeHTML(date)}</p><h3 style="color:#078a73">CONSERVATION OF MATTER • VERIFIED</h3></div><div class="row no-print" style="margin-top:20px"><button class="primary" id="print">Download certificate (PDF)</button><button class="green" id="download">Download answers (.txt)</button><button id="restart">Start over</button></div><p class="help no-print">Answers are stored only in this browser session. Download your answers for Canvas submission before closing the page.</p></section>`;document.getElementById('print').onclick=downloadCertificatePDF;document.getElementById('download').onclick=()=>{const lines=[`POKER CHIP CHEMISTRY`, `Student: ${student}`,`Period: ${period}`,`Level: ${level}`,`Date: ${date}`,'',...records.flatMap((r,i)=>[`Mission ${i+1}: ${r.title}`,`Balanced equation: ${r.equation}`,`Chip counts: ${r.counts}`,`Reasoning answer: ${r.reasoning}`,`Written explanation: ${r.explanation}`,''])];const blob=new Blob([lines.join('\n')],{type:'text/plain'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='Poker_Chip_Chemistry_'+student.replace(/[^a-z0-9_-]/gi,'_')+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)};document.getElementById('restart').onclick=start}
start();
</script></body></html>
